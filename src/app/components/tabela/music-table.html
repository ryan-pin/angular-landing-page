<p-card header="Minhas Músicas" styleClass="shadow-lg">
  <p-table 
    [value]="musicas()" 
    [tableStyle]="{ 'min-width': '100%' }"
    styleClass="p-datatable-striped"
  >
    <ng-template pTemplate="header">
      <tr class="bg-blue-50">
        <th class="text-left font-bold text-gray-800">#</th>
        <th class="text-left font-bold text-gray-800">Nome</th>
        <th class="text-left font-bold text-gray-800">Duração</th>
        <th class="text-center font-bold text-gray-800">Favorita</th>
        <th class="text-center font-bold text-gray-800">Ações</th>
      </tr>
    </ng-template>
    
    <ng-template pTemplate="body" let-musica let-rowIndex="rowIndex">
      <tr class="hover:bg-blue-50 transition-colors">
        <td class="text-gray-600 font-medium">{{ rowIndex + 1 }}</td>
        <td class="font-semibold text-gray-900">{{ musica.nome }}</td>
        <td class="text-gray-700">{{ musica.duracao }} min</td>
        <td class="text-center">
          <button 
            (click)="toggleFavorito(musica.id)"
            class="transition-transform hover:scale-110"
          >
            <i 
              [class]="musica.favorito ? 'pi pi-star-fill text-yellow-500' : 'pi pi-star text-gray-400'" 
              class="text-2xl cursor-pointer"
            ></i>
          </button>
        </td>
        <td class="text-center">
          <p-button 
            icon="pi pi-trash" 
            severity="danger" 
            [text]="true"
            [rounded]="true"
            (onClick)="removerMusica(musica.id)"
            pTooltip="Remover música"
            tooltipPosition="top"
          />
        </td>
      </tr>
    </ng-template>
    
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="text-center py-12">
          <i class="pi pi-inbox text-6xl text-gray-300 block mb-4"></i>
          <p class="text-gray-500 font-medium text-lg">
            Nenhuma música cadastrada ainda
          </p>
          <p class="text-gray-400 text-sm mt-2">
            Adicione sua primeira música usando o formulário acima!
          </p>
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
