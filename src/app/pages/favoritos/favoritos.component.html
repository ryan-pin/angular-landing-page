<div class="min-h-screen bg-linear-to-br from-yellow-50 to-orange-50 py-8 px-4">
  <div class="max-w-6xl mx-auto">
    
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-5xl font-bold text-gray-800">
        ⭐ Músicas Favoritas
      </h1>
      <a routerLink="/">
        <p-button 
          label="Ver Todas" 
          icon="pi pi-list" 
          severity="info"
        />
      </a>
    </div>

    @if (musicasFavoritas().length > 0) {
      <app-musica-list 
        [musicas]="musicasFavoritas()"
        (musicaRemovida)="onMusicaRemovida($event)"
        (favoritoAlterado)="onFavoritoAlterado($event)"
      />
    } @else {
      <div class="bg-white rounded-lg shadow-lg p-12 text-center">
        <i class="pi pi-star text-8xl text-gray-300 block mb-6"></i>
        <h2 class="text-2xl font-bold text-gray-700 mb-3">
          Nenhuma música favorita ainda
        </h2>
        <p class="text-gray-500 mb-6">
          Marque algumas músicas como favoritas para vê-las aqui!
        </p>
        <a routerLink="/">
          <p-button 
            label="Ir para Playlist" 
            icon="pi pi-arrow-left" 
            severity="info"
          />
        </a>
      </div>
    }

  </div>
</div>
